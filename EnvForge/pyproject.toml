[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envforge"
version = "0.1.0"
description = "EnvForge：本地运行时版本、项目环境档案与系统环境变量管理工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.7"]

[project.scripts]
envforge = "envforge.cli:main"

[tool.setuptools]
# 根目录的 envforge.py 只是源码检出启动器，不进入 wheel；真实包在 src/envforge。
py-modules = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
