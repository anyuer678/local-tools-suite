[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quickdeck"
version = "0.1.0"
description = "常驻后台、全局快捷键呼出、键盘为中心的可扩展快捷工具台"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "QuickDeck" }]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
dev = ["pytest>=8"]

[project.scripts]
quickdeck = "quickdeck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
