[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recallfs"
version = "0.1.0"
description = "RecallFS - 面向开发资料与个人知识资产的本地离线检索应用"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RecallFS" }]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.1"]
pptx = ["python-pptx>=0.6"]
gui = ["PySide6>=6.5"]
bench = ["psutil>=5.9"]

[project.scripts]
recallfs = "recallfs.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
